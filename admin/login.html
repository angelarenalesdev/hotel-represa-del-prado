<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administrador Hotel Represa del Prado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
</head>
<body>
    <main class="login-shell">
        <section class="login-brand">
            <div class="brand-inner">
                <img src="../img/LogoOKOBO.jpg" alt="Logo" class="brand-logo">
                <h1>Hotel Represa del Prado</h1>
                <p>Gestiona cabañas, inventario y reservas desde un solo lugar.</p>
                <ul>
                    <li><i class="bi bi-house-heart"></i>Aforo de cabañas en tiempo real</li>
                    <li><i class="bi bi-box-seam"></i>Alertas de bajo stock</li>
                    <li><i class="bi bi-calendar-check"></i>Reservas recibidas desde la web</li>
                </ul>
            </div>
        </section>

        <section class="login-panel">
            <div class="login-card">
                <div class="login-header">
                    <img src="../img/LogoOKOBO.jpg" alt="Logo" class="login-logo d-lg-none">
                    <span class="login-kicker">Panel administrativo</span>
                    <h2>Bienvenido de nuevo</h2>
                    <p>Ingresa con tu cuenta de administrador.</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <div class="field">
                            <i class="bi bi-envelope"></i>
                            <input type="email" class="form-control" id="email" placeholder="admin@tuhotel.com" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="field">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>

                    <div class="alert alert-danger d-none" id="errorAlert"></div>

                    <button type="submit" class="btn btn-login w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>

                    <div class="text-center">
                        <a href="../index.html" class="back-link">
                            <i class="bi bi-arrow-left me-1"></i>Volver al sitio web
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('togglePass').addEventListener('click', function () {
            const input = document.getElementById('password');
            const mostrar = input.type === 'password';
            input.type = mostrar ? 'text' : 'password';
            this.innerHTML = mostrar ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    </script>
    <script src="js/login.js"></script>
</body>
</html>
